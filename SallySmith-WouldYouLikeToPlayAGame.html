<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Would You Like to Play a Game?</title>
<style>
:root{--bg:#030506;--panel:#080d0c;--line:#294032;--green:#58ff83;--dim:#718078;--white:#e9eee9;--amber:#d9bd61}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030506;color:var(--white);font-family:"Courier New",monospace}body{overflow-x:hidden;background:radial-gradient(circle at 50% 38%,#102018 0,#050908 34%,#020304 78%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px,#fff 4px);z-index:20}.shell{max-width:980px;margin:auto;padding:22px 22px 70px}.top{display:flex;justify-content:space-between;gap:15px;color:var(--dim);font-size:11px;letter-spacing:2px}.top b{color:var(--green);font-weight:normal}.bar{height:3px;background:#111914;margin:18px 0 30px}.bar i{display:block;height:100%;background:var(--green);width:0;box-shadow:0 0 10px rgba(88,255,131,.5);transition:width .55s}.screen{min-height:590px;display:flex;flex-direction:column;justify-content:center}.terminal{border:1px solid var(--line);background:rgba(4,9,7,.9);padding:38px;box-shadow:0 0 50px rgba(0,0,0,.55),inset 0 0 50px rgba(88,255,131,.025)}.boot{color:var(--dim);font-size:12px;line-height:1.8}.cursor:after{content:"█";color:var(--green);animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}h1{font-size:clamp(40px,8vw,82px);line-height:.9;margin:55px 0 30px;letter-spacing:-3px;color:#f4f7f4;text-shadow:0 0 20px rgba(88,255,131,.18)}h2{font-size:clamp(25px,4vw,42px);margin:8px 0 20px;color:var(--green);letter-spacing:-1px}p{font-family:Arial,sans-serif;font-size:18px;line-height:1.58;max-width:800px}.green{color:var(--green)}.amber{color:var(--amber)}.muted{color:var(--dim);font-size:13px}.prompt{color:var(--green);font-size:16px;margin:25px 0 10px}.choice,button{font:inherit;cursor:pointer;text-align:left;color:#dbe5dc;background:#07100b;border:1px solid #3a4d40;padding:16px 18px;margin:9px 0;width:100%;letter-spacing:.6px;transition:.18s}.choice:hover,.choice:focus,button:hover,button:focus{outline:none;border-color:var(--green);color:var(--green);background:#0b1710;box-shadow:0 0 18px rgba(88,255,131,.09)}.choice .key{display:inline-block;width:25px;color:var(--green)}.feedback{margin-top:22px;border-left:3px solid var(--green);padding:16px 18px;background:#07110b}.feedback.bad{border-color:var(--amber)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:25px 0}.stat{border:1px solid #203127;padding:17px;background:#060a08}.stat b{display:block;font-size:29px;color:#fff}.stat span{display:block;margin-top:5px;color:var(--dim);font-size:10px;letter-spacing:1px}.case{border:1px solid #203127;padding:21px;margin:13px 0;background:#060a08}.case strong{color:var(--amber);font-size:13px;letter-spacing:1px}.case .flow{color:var(--dim);margin:10px 0;font-size:13px;line-height:1.7}.case .answer{color:var(--green)}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.match{border:1px solid #203127;padding:18px;background:#060a08}.match b{color:var(--green);display:block;margin-bottom:7px}.final{text-align:center}.final h1{font-size:clamp(34px,6vw,64px)}.final .quote{font-family:"Courier New",monospace;color:var(--green);font-size:20px;line-height:1.5;margin:35px auto;max-width:700px}.sig{margin-top:35px;color:#fff}.sig span{color:var(--dim);display:block;font-size:12px;margin-top:7px}.restart{width:auto;text-align:center;margin-top:30px}.hidden{display:none}@media(max-width:650px){.shell{padding:16px 14px 50px}.terminal{padding:25px 18px}.screen{min-height:620px}.stats{grid-template-columns:1fr 1fr}.matrix{grid-template-columns:1fr}h1{letter-spacing:-2px}.top{font-size:9px}}
</style></head>
<body><div class="shell"><div class="top"><span>WOPR // <b>TRANSFORMATION SIMULATION</b></span><span id="clock">00:00:00</span></div><div class="bar"><i id="progress"></i></div><main id="game" class="screen"></main></div>
<script>
const game=document.getElementById('game'),progress=document.getElementById('progress');let level=0,score=0;
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false}),1000);
const levels=[
{title:'THE ENVIRONMENT',tag:'LEVEL 01 // INITIAL CONDITIONS',html:`<div class="terminal"><div class="boot">SYSTEM READY<br>CONNECTION ESTABLISHED<br>SIMULATION PARAMETERS LOADED</div><h2>THE ENVIRONMENT</h2><p>You inherit a distributed organization. Thousands of people. Dozens of sites. A finite team. And technology changing faster than the organization can absorb it.</p><div class="stats"><div class="stat"><b>8,500</b><span>USERS</span></div><div class="stat"><b>25</b><span>SITES</span></div><div class="stat"><b>1,500</b><span>DEVICES</span></div><div class="stat"><b>6</b><span>TECH PEOPLE</span></div></div><div class="prompt">> WHERE DO YOU START?</div><button class="choice" data-points="0">[A] Deploy the newest AI tools immediately.</button><button class="choice" data-points="0">[B] Build the governance framework first.</button><button class="choice" data-points="1">[C] Understand the work, the people and the friction.</button><div id="feedback"></div></div>`},
{title:'THE FIRST MOVE',tag:'LEVEL 02 // PATTERN RECOGNITION',html:`<div class="terminal"><div class="boot">ANALYSIS COMPLETE<br>PATTERN DETECTED</div><h2>THE FIRST MOVE</h2><p>There isn't one magic starting point.</p><p>The first move is to understand <span class="green">what people are trying to accomplish</span>, where work gets stuck, and what outcome the organization actually needs.</p><div class="feedback"><b>MY APPROACH</b><br><br><span class="green">I don't start with technology.<br>I start with the work.</span></div><p class="muted">That changes the question from “What can AI do?” to “Where could AI remove friction?”</p><button class="next">CONTINUE →</button></div>`},
{title:'REMOVE THE FRICTION',tag:'LEVEL 03 // THE WORK',html:`<div class="terminal"><div class="boot">SCENARIO LIBRARY // LIVE EXAMPLES</div><h2>REMOVE THE FRICTION</h2><p>Three ordinary problems. None required a grand AI strategy. They required someone to notice where the work was unnecessarily hard.</p><div class="case"><strong>VOICE MAIL</strong><div class="flow">voicemail → listening → interpreting → typing → routing → action</div><div class="answer">AI transcription + summary + workflow</div><p>Nothing about the employee's job changed.<br><b>The friction did.</b></p></div><div class="case"><strong>HELPDESK</strong><div class="flow">incoming ticket → manual triage → queue → assignment</div><div class="answer">AI classification → appropriate team</div></div><div class="case"><strong>GOVERNANCE</strong><div class="flow">meetings + documents + approvals + publication</div><div class="answer">Power Platform → connected workflow</div></div><button class="next">SHOW ME THE OUTCOME →</button></div>`},
{title:'THE OUTCOME',tag:'LEVEL 04 // OPERATIONAL CHANGE',html:`<div class="terminal"><div class="boot">SIMULATION DATA // ORGANIZATIONAL SCALE</div><h2>THE OUTCOME</h2><p>Technology only matters if it changes what the organization can do.</p><div class="stats"><div class="stat"><b>13 → 6</b><span>TECH TEAM / 2019–2026</span></div><div class="stat"><b>$198K</b><span>ONE-TIME SAVINGS</span></div><div class="stat"><b>$100K+</b><span>ANNUAL SAVINGS</span></div><div class="stat"><b>25</b><span>SITES SERVED</span></div></div><div class="feedback"><span class="green">We didn't solve the problem by working harder.</span><br><br>We changed how the work was done.</div><button class="next">NEXT SCENARIO →</button></div>`},
{title:'THE DOCUMENT IS NOT THE WORK',tag:'LEVEL 05 // THE HUMAN SYSTEM',html:`<div class="terminal"><div class="boot">SYSTEM OBSERVATION // HUMAN WORKFLOW DETECTED</div><h2>THE DOCUMENT IS NOT THE WORK</h2><p>Somewhere along the way, we've allowed the <span class="green">document to become the work.</span></p><p>The form becomes the process. The spreadsheet becomes the system. The ticket becomes the interaction. The email becomes the communication.</p><p>But none of those things are actually the work.</p><div class="feedback"><b>THE WORK IS PEOPLE.</b><br><br><span class="green">People making decisions.<br>People solving problems.<br>People helping other people.<br>People trying to get something done.</span></div><p>Technology should make that work easier, clearer and more human — not create another layer of work around it.</p><div class="prompt">> SO WHAT CHANGES?</div><button class="choice" data-points="1">[A] Digitize the document.</button><button class="choice" data-points="1">[B] Automate the process.</button><button class="choice" data-points="1">[C] Understand the people and redesign the work around them.</button><div id="feedback"></div><div class="feedback" style="margin-top:22px"><b>CHANGE MANAGEMENT + MODERNIZING OPERATIONS</b><br><br><span class="green">Technology changes the mechanism. Change management helps people move with it.</span><br><br>I modernize operations by making the change understandable, useful and measurable — then learning from what actually happens in the organization.</div></div>`},
{title:'THE MATCH',tag:'LEVEL 06 // CUSTOMER SUCCESS',html:`<div class="terminal"><div class="boot">MATCHING CUSTOMER NEEDS TO EVIDENCE</div><h2>WHAT ARE YOU REALLY LOOKING FOR?</h2><p>Microsoft's challenge isn't simply deploying Copilot. It is helping organizations turn AI into measurable change.</p><div class="matrix"><div class="match"><b>AI TRANSFORMATION</b>M365 Copilot, Copilot Studio, agents and AI embedded in workflow.</div><div class="match"><b>CUSTOMER ADVOCACY</b>8,500 users across 25 sites. Staff, school leaders, executives and operational teams.</div><div class="match"><b>BUSINESS VALUE</b>Automation, measurable savings, replaced services and improved operational flow.</div><div class="match"><b>MICROSOFT ECOSYSTEM</b>Microsoft EDU Insiders. Presented to Microsoft engineers. Partner POCs built inside M365.</div><div class="match"><b>CHANGE + GOVERNANCE</b>Strategic planning, privacy, security, data governance and adoption.</div><div class="match"><b>BUILDER MINDSET</b>Real systems. Real users. Real feedback. Iterate, learn, improve.</div></div><button class="next">RUN FINAL DIAGNOSTIC →</button></div>`},
];
function boot(){game.innerHTML=`<div class="terminal"><div class="boot">WOPR // PERSONALITY CORE ONLINE<br>SCENARIO: CUSTOMER AI TRANSFORMATION<br>OBJECTIVE: UNKNOWN<br>USER INPUT REQUIRED<span class="cursor"></span></div><h1>WOULD YOU LIKE<br>TO PLAY A GAME?</h1><p class="muted">A different kind of application.</p><button id="yes">[ Y ] &nbsp; YES</button><button id="no">[ N ] &nbsp; NO</button><div id="startmsg"></div></div>`;progress.style.width='0%';document.getElementById('yes').onclick=()=>start();document.getElementById('no').onclick=()=>{document.getElementById('startmsg').innerHTML='<div class="feedback bad">That would be a very short application.<br><br><span class="green">[ Y ] &nbsp; Try again.</span></div>'};}
function start(){level=0;score=0;renderLevel();}
function renderLevel(){const l=levels[level];game.innerHTML=l.html;progress.style.width=((level)/levels.length*100)+'%';game.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(b)));game.querySelectorAll('.next').forEach(b=>b.addEventListener('click',()=>{level++;if(level<levels.length)renderLevel();else final();}));}
function choose(b){const fb=document.getElementById('feedback');const pts=Number(b.dataset.points);score+=pts;game.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.innerHTML=pts?'<div class="feedback">CORRECT PATTERN.<br><br><span class="green">Start with the work. Technology follows the problem.</span></div>':'<div class="feedback bad">INTERESTING CHOICE.<br><br>Technology, governance and readiness all matter. But without understanding the work, you risk optimizing the wrong thing.</div>';const old=game.querySelector('.choiceContinue');if(old)old.remove();const btn=document.createElement('button');btn.type='button';btn.className='choiceContinue';btn.textContent='CONTINUE →';fb.appendChild(btn);btn.addEventListener('click',()=>{level++;if(level<levels.length)renderLevel();else final();},{once:true});}
function final(){progress.style.width='100%';game.innerHTML=`<div class="terminal final"><div class="boot">FINAL DIAGNOSTIC COMPLETE<br>RESULT: TRANSFORMATION EXPERIENCE VERIFIED</div><h1>YOU WEREN'T ASKED<br>TO READ ABOUT<br>TRANSFORMATION.</h1><div class="quote">You just experienced it.</div><p>Not a theoretical understanding of digital transformation.<br>Not a collection of AI demos.</p><p>A track record of taking complicated organizations, finding the friction, building something useful, getting people to use it, and learning from what happens next.</p><div class="sig">DIRECTOR OF ORGANIZATIONAL INNOVATION AND TECHNOLOGY<span>Foothills School Division · Alberta</span></div><p class="green" style="margin:38px auto 0">The technology is the mechanism.<br>The people are the reason.<br>The transformation is the work.</p><button class="next" id="resumeBtn">VIEW THE RESUME →</button><button class="restart" id="restart">PLAY AGAIN</button></div>`;document.getElementById('resumeBtn').onclick=resume;document.getElementById('restart').onclick=boot;}
function resume(){progress.style.width='100%';game.innerHTML=`<div class="terminal"><div class="boot">PERSONNEL FILE // DECLASSIFIED<br>APPLICANT PROFILE // DIRECTOR OF ORGANIZATIONAL INNOVATION AND TECHNOLOGY</div><h2>SALLY SMITH</h2><p class="green">Technology is the mechanism. Transformation is the outcome.</p><div class="case"><strong>SUMMARY</strong><p>I lead with insight, energy, and a builder's mindset. With a wealth of experience, I've delivered scalable, real-world AI and automation solutions across twenty-five sites serving 8,500 users. I design systems people actually want to use — and the best ones, people don't even realize they are using something new.</p><p>My strength lies in understanding business processes and the people embedded within them, and designing solutions that remove friction. I lead change management alongside technology delivery, helping people understand why work is changing, what is changing, and how the organization learns from it. I focus on modernizing operations so technology becomes part of better work rather than another layer around it.</p></div><div class="case"><strong>EXPERIENCE</strong><h3>DIRECTOR ORGANIZATIONAL INNOVATION AND TECHNOLOGY · FOOTHILLS SCHOOL DIVISION · 2019–PRESENT</h3><p>• Developed a five-year technology strategic plan defining a path for digital transformation while safeguarding data and following provincial privacy legislation.<br>• Led division-wide modernization onto Microsoft 365, including SharePoint, OneDrive, Teams, Intune and Power Platform.<br>• Developed and deployed custom Copilot AI agents in Teams, SharePoint and web environments.<br>• Led change management and modernized operational processes across business units and schools, redesigning work around people rather than existing documents and systems.<br>• Migrated on-premises file storage to OneDrive/SharePoint and devices to Intune/Autopilot.<br>• Built staff/student portals, HR workflows and Power Apps solutions.<br>• Managed cross-functional collaboration across Finance, HR, Communications and Learning Services.<br>• Reduced the technology team from 13 to 6 while improving service through modernization and process redesign.<br>• Delivered $198K in one-time savings and more than $100K in annual savings.</p><h3>BUSINESS SYSTEMS ANALYST · FOOTHILLS SCHOOL DIVISION · 2005–2019</h3><p>Designed and implemented business processes across HR, student information and financial systems; consolidated redundant applications and supported provincial compliance and reporting.</p><h3>CONSULTANT · EDSEMBLI · 2019</h3><p>Supported Alberta education partners on digital document and digitization strategies.</p></div><div class="case"><strong>SELECTED BUILDING / AI WORK</strong><p>Governance app in Power Apps · Facility Services mobile app · AI helpdesk triage · AI voicemail transcription and summarization · Copilot agents for staff workflows · Consent Parent Portal · HR certificate management · Annual Staff Intent workflow · Executive Parent Concern workflow · automated identity/account provisioning.</p></div><div class="case"><strong>MICROSOFT + THOUGHT LEADERSHIP</strong><p>Microsoft EDU Insiders · Presented to Microsoft engineers on AI and innovation in education · Presenter for College of Alberta School Superintendents and Alberta School Business Officials Association · AI panel, EdCan Network · AI in Education presenter, University of Calgary · Microsoft partner proof-of-concept advisor.</p></div><div class="case"><strong>TOOLS &amp; TECH</strong><p>Microsoft 365 · SharePoint · Power Automate · Teams · Intune · Copilot Studio · Power Apps · Azure / Entra · API integrations · platform migrations · data governance · FOIP/privacy compliance · workflow automation · systems thinking.</p></div><div class="case"><strong>EDUCATION</strong><p>MBA — Leadership, Coaching and Mentoring<br>MCSA — SQL Server 2012<br>PhD Candidate — Ethical and Effective Microsoft AI Adoption (proposal deferred until 2027)</p></div><p class="green" style="text-align:center;margin-top:35px">BUILDER. INTEGRATOR. CHANGE AGENT.</p><div class="case" style="text-align:center;margin-top:26px"><strong>CONNECT</strong><p style="text-align:center;margin:14px auto 16px;font-family:'Courier New',monospace;font-size:14px">LINKEDIN // SALLY SMITH</p><a href="https://www.linkedin.com/in/sally-smith-technologyservices?utm_source=share_via&utm_content=profile&utm_medium=member_ios" target="_blank" rel="noopener noreferrer" aria-label="Open Sally Smith LinkedIn profile" style="color:var(--green);text-decoration:none;border:1px solid #3a4d40;padding:13px 20px;display:inline-block">OPEN LINKEDIN PROFILE →</a></div><button class="restart" id="restart">PLAY AGAIN</button></div>`;document.getElementById('restart').onclick=boot;}
boot();
</script></body></html>
